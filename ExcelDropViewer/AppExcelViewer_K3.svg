<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 메탈릭 녹색 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e7e34"/>
      <stop offset="50%" stop-color="#105a22"/>
      <stop offset="100%" stop-color="#0a3814"/>
    </linearGradient>
    
    <!-- K3 글자 입체 은빛 그라데이션 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- 입체 그림자 효과 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. 메인 입체 라운드 타일 배경 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- 2. 스프레드시트 셀 그리드 은은한 패턴 -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" fill="none">
    <line x1="96" y1="160" x2="416" y2="160"/>
    <line x1="96" y1="220" x2="416" y2="220"/>
    <line x1="96" y1="280" x2="416" y2="280"/>
    <line x1="96" y1="340" x2="416" y2="340"/>
    <line x1="200" y1="110" x2="200" y2="390"/>
    <line x1="312" y1="110" x2="312" y2="390"/>
  </g>

  <!-- 3. 중앙 입체 "K3" 시그니처 로고 -->
  <text x="256" y="305" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="900" 
        font-size="180" 
        text-anchor="middle" 
        fill="url(#textGrad)" 
        filter="url(#dropShadow)"
        letter-spacing="-4">K3</text>
  
  <!-- 4. 상단 광택 효과 -->
  <path d="M 32 128 A 96 96 0 0 1 128 32 L 384 32 A 96 96 0 0 1 480 128 Q 256 180 32 128 Z" fill="#ffffff" fill-opacity="0.1"/>
</svg>
