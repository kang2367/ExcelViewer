<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 다크 테크놀로지 그라데이션 -->
    <linearGradient id="bgTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- K3 메탈릭 그린 뱃지 그라데이션 -->
    <linearGradient id="k3Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- 은빛 입체 텍스트 그라데이션 -->
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. 바탕 라운드 메인보드 타일 -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="url(#bgTech)" filter="url(#shadow)"/>

  <!-- 2. 스프레드시트 폼 + 회로 기판 그리드 패턴 -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <rect x="80" y="80" width="352" height="352" rx="16" stroke="#475569" stroke-width="4"/>
    <!-- 가로 그리드 -->
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="230" x2="432" y2="230"/>
    <line x1="80" y1="300" x2="432" y2="300"/>
    <line x1="80" y1="370" x2="432" y2="370"/>
    <!-- 세로 그리드 -->
    <line x1="180" y1="80" x2="180" y2="432"/>
    <line x1="300" y1="80" x2="300" y2="432"/>
  </g>

  <!-- 3. 전자 부품 회로 노드 (BOM DB 연결 의미) -->
  <g fill="#22C55E">
    <circle cx="240" cy="195" r="7"/>
    <circle cx="366" cy="265" r="7"/>
    <circle cx="240" cy="335" r="7"/>
  </g>
  <g stroke="#22C55E" stroke-width="3" stroke-dasharray="6,6" fill="none">
    <path d="M 240 195 L 366 265 L 240 335"/>
  </g>

  <!-- 4. 좌상단 K3 메탈릭 그린 뱃지 -->
  <path d="M 60 60 L 220 60 L 190 180 L 60 180 Z" fill="url(#k3Badge)" filter="url(#shadow)"/>

  <!-- 5. 뱃지 내 K3 시그니처 텍스트 -->
  <text x="130" y="142" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="900" 
        font-size="72" 
        text-anchor="middle" 
        fill="url(#silverText)" 
        letter-spacing="-2">K3</text>
  
  <!-- 6. 우측 하단 IC 칩 테두리 포인트 -->
  <rect x="330" y="330" width="70" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
  <line x1="345" y1="320" x2="345" y2="330" stroke="#38BDF8" stroke-width="3"/>
  <line x1="365" y1="320" x2="365" y2="330" stroke="#38BDF8" stroke-width="3"/>
  <line x1="385" y1="320" x2="385" y2="330" stroke="#38BDF8" stroke-width="3"/>
</svg>
